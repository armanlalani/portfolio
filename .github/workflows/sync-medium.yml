# Once a day, add any new Medium posts to src/data/posts.json and commit them.
# The commit triggers a normal Netlify deploy, which rebuilds the site.
# Can also be run by hand: GitHub → Actions → "Sync Medium posts" → Run workflow.

name: Sync Medium posts

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC = 09:00 IST, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-medium
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies (Yarn version comes from package.json)
        run: |
          corepack enable
          yarn install --immutable

      - name: Add new Medium posts to posts.json
        run: yarn sync:medium

      - name: Check the site still builds
        run: yarn build

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/data/posts.json; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/posts.json
          git commit -m "writing | sync new Medium posts"
          git push
